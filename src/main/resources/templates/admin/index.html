<!doctype html>
<html lang="en">
<head>
    <title>All user</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/simple-notify/dist/simple-notify.css" />
    <link href="/css/main.css" rel="stylesheet">
</head>
<body class="h-100">
<main class="h-100">
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <div class="container-fluid">
            <span id="main-logo" class="navbar-brand"></span>
            <button class="navbar-toggler">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse">
                <span class="me-auto"></span>
                <form action="/logout">
                    <button class="btn btn-outline-secondary" type="submit">Logout</button>
                </form>
            </div>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row flex-nowrap px-0">
            <div class="col-auto col-md-3 col-xl-2 px-0">
                <div class="d-flex flex-column align-items-center align-items-sm-start px-0 pt-2 min-vh-100">
                    <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100"  id="side-menu"></ul>
                </div>
            </div>
            <div class="col p-5 bg-light h-auto table-responsive-md">
                <h3>Admin panel</h3>
                <ul class="nav nav-tabs border-bottom-0">
                    <li class="nav-item">
                        <button class="nav-link active" id="home-tab" data-bs-toggle="tab" data-bs-target="#home-tab-pane" type="button" role="tab" aria-controls="home-tab-pane" aria-selected="true">Admin</button>
                    </li>
                    <li class="nav-item">
                        <button class="nav-link" id="create-tab" data-bs-toggle="tab" data-bs-target="#create-tab-pane" type="button" role="tab" aria-controls="create-tab-pane">User</button>
                    </li>
                </ul>
                <div class="tab-content">
                    <div class="tab-pane fade show active" id="home-tab-pane" role="tabpanel" aria-labelledby="home-tab" tabindex="0">
                        <div class="card h-100 w-100 rounded-0 rounded-bottom-1">
                            <div class="card-header">
                                <strong>All user</strong>
                            </div>
                            <div class="card-body table-responsive-md">
                                <table class="table table-striped">
                                    <thead>
                                    <tr>
                                        <th scope="col">ID</th>
                                        <th scope="col">First Name</th>
                                        <th scope="col">Last Name</th>
                                        <th scope="col">Age</th>
                                        <th scope="col">Email</th>
                                        <th scope="col">Roles</th>
                                        <th scope="col">Edit</th>
                                        <th scope="col">Delete</th>
                                    </tr>
                                    </thead>
                                    <tbody id="users-tbody">
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                    <div class="tab-pane fade" id="create-tab-pane" role="tabpanel" aria-labelledby="create-tab" tabindex="0">
                        <div class="card h-100 w-100">
                            <div class="card-header">
                                <strong>Add new user</strong>
                            </div>
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-xl-4 offset-xl-4">
                                        <form id="index-add-form" action="#" method="post">
                                            <div class="mb-3">
                                                <label for="firstname" class="form-label fw-bold">First Name</label>
                                                <input type="text" class="form-control" id="firstname" name="firstname" value="">
                                            </div>
                                            <div class="mb-3">
                                                <label for="lastname" class="form-label fw-bold">Last Name</label>
                                                <input type="text" class="form-control" id="lastname" name="lastname" value="">
                                            </div>
                                            <div class="mb-3">
                                                <label for="age" class="form-label fw-bold">Age</label>
                                                <input type="number" class="form-control" id="age" name="age" value="">
                                            </div>
                                            <div class="mb-3">
                                                <label for="username" class="form-label fw-bold">Email</label>
                                                <input type="email" class="form-control" id="username" name="username" value="">
                                            </div>
                                            <div class="mb-3">
                                                <label for="password" class="form-label fw-bold">Password</label>
                                                <input type="password" class="form-control" id="password" name="password" value="">
                                            </div>
                                            <div class="mb-3">
                                                <label for="roles" class="form-label fw-bold">Choose Roles</label>
                                                <select class="form-control" name="roles" id="roles" multiple="" required="">
                                                    <option value="1">ADMIN</option>
                                                    <option value="2" selected="selected">USER</option>
                                                </select>
                                            </div>
                                            <button type="submit" class="btn btn-success" data-submit="Add">Add new user</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Modal -->
        <div class="modal fade" id="user-modal">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div>
                        <div class="modal-header">
                            <h5 class="modal-title" id="user-modal-label">Edit user</h5>
                            <button type="button" class="btn-close close-modal-dialog" aria-label="Close"></button>
                        </div>
                        <form action="#" method="post">
                            <div class="modal-body">
                                <div class="mb-3">
                                    <label for="id" class="form-label fw-bold">ID</label>
                                    <input class="form-control not" type="text" disabled>
                                    <input id="id" name="id" type="hidden"/>
                                </div>
                                <div class="mb-3">
                                    <label for="firstname" class="form-label fw-bold">First Name</label>
                                    <input type="text" class="form-control" id="firstname" name="firstname" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="lastname" class="form-label fw-bold">Last Name</label>
                                    <input type="text" class="form-control" id="lastname" name="lastname" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="age" class="form-label fw-bold">Age</label>
                                    <input type="number" class="form-control" id="age" name="age" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="username" class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" id="username" name="username" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="password" class="form-label fw-bold">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" value="">
                                </div>
                                <div class="mb-3">
                                    <label for="roles" class="form-label fw-bold">Choose Roles</label>
                                    <select class="form-control" name="roles" id="roles" multiple="" required="">
                                        <option value="1">ADMIN</option>
                                        <option value="2" selected="selected">USER</option>
                                    </select>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Edit</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"
        integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-notify/dist/simple-notify.min.js"></script>
<script type="module" src="/js/common.js"></script>
<script type="module" src="/js/adminIndex.js"></script>
</body>
</html>
